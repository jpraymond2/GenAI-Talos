[project]
name = "recall"
version = "0.1.0"
description = "Voice-first meeting-prep agent for the Open Agent Hackathon 2026."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pydantic",
    "pydantic-settings",
    "typer",
    "httpx",
    "openai",
    "duckdb",
    "rapidfuzz",
    "numpy",
    "python-dotenv",
    "google-api-python-client",
    "google-auth-oauthlib",
    "sounddevice",
    "soundfile",
    "nvidia-riva-client",
    "pynput",
    "tavily-python",
    "pytest",
    "pyyaml>=6.0.3",
    "tzdata>=2026.5",
]

[project.optional-dependencies]
whisper = ["faster-whisper"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["recall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
